<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Search</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    // Tailwind Config for theme extension
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'win11-expand': 'win11Expand 0.22s cubic-bezier(0, 0, 0.2, 1) forwards',
            'win11-collapse': 'win11Collapse 0.18s cubic-bezier(0.4, 0, 1, 1) forwards',
            'slide-down-in': 'slideDownIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            win11Expand: {
              '0%': { opacity: '0', transform: 'scale(0.96) translateY(-8px)' },
              '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
            },
            win11Collapse: {
              '0%': { opacity: '1', transform: 'scale(1) translateY(0)' },
              '100%': { opacity: '0', transform: 'scale(0.96) translateY(-8px)' },
            },
            slideDownIn: {
              '0%': { opacity: '0', transform: 'translateY(-12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar for Dropdown */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.5);
    }

    /* Dynamic CSS Variables for Accent Color */
    :root {
      --accent-color: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.12);
    }

    .text-accent { color: var(--accent-color); }
    .bg-accent { background-color: var(--accent-color); }
    .bg-accent-soft { background-color: var(--accent-soft); }
    .border-accent { border-color: var(--accent-color); }

    /* Initial hidden state for delayed load animation */
    .initial-delay-hide {
      opacity: 0;
      transform: translateY(-12px);
    }
  </style>
</head>

<body class="h-full font-sans transition-colors duration-300 antialiased selection:bg-accent selection:text-white relative overflow-x-hidden flex flex-col bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">

  <!-- Ambient Wallpaper Background Tint Container -->
  <div id="wallpaper-tint" class="fixed inset-0 pointer-events-none z-0 transition-all duration-700 opacity-100"></div>

  <!-- MAIN WRAPPER -->
  <div class="relative z-10 flex flex-col min-h-screen">

    <!-- 1. TOP NAV (Left aligned icons with explicit SVG rendering) -->
    <header class="w-full p-4 md:p-6 flex items-center justify-between">
      <div class="hidden sm:flex items-center space-x-3">
        <!-- Extension Button -->
        <a 
          href="https://chromewebstore.google.com/" 
          target="_blank" 
          rel="noopener noreferrer"
          title="Chrome Web Store"
          class="w-10 h-10 rounded-full flex items-center justify-center border border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md text-slate-600 dark:text-slate-300 hover:text-accent hover:border-accent dark:hover:border-accent transition-all duration-200 shadow-sm hover:shadow active:scale-95 group"
        >
          <!-- Puzzle Piece SVG -->
          <svg class="w-5 h-5 fill-current transition-transform group-hover:scale-105" viewBox="0 0 24 24">
            <path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.38 0 2.5 1.12 2.5 2.5s-1.12 2.5-2.5 2.5H2v4c0 1.1.9 2 2 2h4v-1.5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5V21h4c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5s-1.12-2.5-2.5-2.5z"/>
          </svg>
        </a>

        <!-- Download Button -->
        <a 
          href="https://getdragonweb.netlify.app/" 
          target="_blank" 
          rel="noopener noreferrer"
          title="Get Dragon Web App"
          class="w-10 h-10 rounded-full flex items-center justify-center border border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md text-slate-600 dark:text-slate-300 hover:text-accent hover:border-accent dark:hover:border-accent transition-all duration-200 shadow-sm hover:shadow active:scale-95 group"
        >
          <!-- Arrow Down To Line SVG -->
          <svg class="w-5 h-5 fill-current transition-transform group-hover:scale-105" viewBox="0 0 24 24">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
        </a>
      </div>

      <!-- Right Nav Side Utilities (Quick Theme Modal Trigger with Paintbrush SVG) -->
      <div class="ml-auto flex items-center space-x-2">
        <button 
          onclick="openModal()" 
          title="Customize Dragon"
          class="p-2 px-3.5 rounded-full border border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all flex items-center gap-2 shadow-sm"
        >
          <!-- Paintbrush SVG (White in dark mode, accent in light mode) -->
          <svg class="w-4 h-4 fill-accent dark:fill-white" viewBox="0 0 24 24">
            <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/>
          </svg>
          <span class="hidden xs:inline">Customize</span>
        </button>
      </div>
    </header>

    <!-- 2. MAIN SEARCH AREA -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 -mt-10 sm:-mt-12">
      <div class="w-full max-w-2xl flex flex-col items-center">
        
        <!-- Dragon Title & Logo Container -->
        <div class="flex items-center justify-center gap-3 sm:gap-4 mb-8 select-none">
          <img src="IMG_6761.PNG" alt="Dragon Logo" class="h-24 sm:h-28 w-auto object-contain dark:hidden">
          <img src="IMG_6762.PNG" alt="Dragon Logo" class="h-24 sm:h-28 w-auto object-contain hidden dark:block">
          <h1 class="text-6xl sm:text-7xl font-bold tracking-tight text-slate-900 dark:text-white transition-colors">
            Dragon
          </h1>
        </div>

        <!-- Search Form & Container -->
        <div id="search-bar-wrapper" class="relative w-full z-30">
          <form 
            id="search-form" 
            action="https://www.google.com/search" 
            method="GET" 
            target="_blank"
            class="relative w-full"
            onsubmit="handleSearchSubmit(event)"
          >
            <div 
              id="search-box-container"
              class="relative flex items-center w-full rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/90 backdrop-blur-xl transition-all duration-300 shadow-lg dark:shadow-none focus-within:border-accent dark:focus-within:border-accent focus-within:ring-2 focus-within:ring-accent/20"
            >
              <!-- Search Input -->
              <input 
                type="text" 
                name="q" 
                id="search-input" 
                autocomplete="off" 
                placeholder="Search the web on Google..." 
                class="w-full py-4 pl-6 pr-14 text-base sm:text-lg bg-transparent text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 rounded-2xl focus:outline-none"
              >

              <!-- Magnifier Button -->
              <button 
                type="submit" 
                title="Search"
                class="absolute right-3 p-2.5 rounded-xl text-slate-400 hover:text-accent dark:text-slate-500 dark:hover:text-accent transition-colors flex items-center justify-center focus:outline-none"
              >
                <!-- Search Magnifier SVG -->
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                  <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
              </button>
            </div>
          </form>

          <!-- Search History Dropdown Menu (Windows 11 Context Style) -->
          <div 
            id="history-dropdown" 
            class="hidden absolute left-0 right-0 top-full mt-2 bg-white/95 dark:bg-slate-900/95 backdrop-blur-2xl border border-slate-200/90 dark:border-slate-800 rounded-2xl shadow-2xl dark:shadow-slate-950/80 overflow-hidden z-40 transition-all duration-200 origin-top"
          >
            <div class="p-3 border-b border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider select-none">
              <span class="flex items-center gap-1.5 pl-1">
                <!-- Clock SVG -->
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                  <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"/>
                </svg>
                Recent History
              </span>
              <button 
                type="button" 
                onclick="clearAllHistory()" 
                class="text-slate-400 hover:text-red-500 dark:hover:text-red-400 transition-colors lowercase font-normal capitalize"
              >
                Clear all
              </button>
            </div>

            <!-- History List Container -->
            <ul id="history-list" class="max-h-60 overflow-y-auto custom-scrollbar py-1">
              <!-- Dynamically populated via LocalStorage -->
            </ul>
          </div>
        </div>

        <!-- 3. OPTION CARDS BELOW SEARCH BAR -->
        <div 
          id="option-cards-container"
          class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full mt-6 initial-delay-hide transition-all duration-300"
        >
          <!-- Card 1: Customize -->
          <div 
            onclick="openModal()" 
            tabindex="0"
            role="button"
            class="group cursor-pointer p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 bg-white/70 dark:bg-slate-900/50 backdrop-blur-md hover:bg-white dark:hover:bg-slate-900 hover:border-slate-300 dark:hover:border-slate-700 transition-all duration-300 shadow-sm hover:shadow-md flex items-center gap-4 focus:outline-none focus:ring-2 focus:ring-accent/50"
          >
            <!-- Squircle Wrapper -->
            <div class="w-12 h-12 rounded-2xl bg-accent-soft text-accent flex items-center justify-center text-lg flex-shrink-0 transition-transform group-hover:scale-105">
              <!-- Paintbrush SVG -->
              <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-200 group-hover:text-accent transition-colors">Customize</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 truncate">Personalize your Dragon experience</p>
            </div>
          </div>

          <!-- Card 2: Search with AI (Magnifier with Sparkles SVG) -->
          <a 
            href="https://google.com/ai" 
            target="_blank" 
            rel="noopener noreferrer"
            tabindex="0"
            class="group cursor-pointer p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 bg-white/70 dark:bg-slate-900/50 backdrop-blur-md hover:bg-white dark:hover:bg-slate-900 hover:border-slate-300 dark:hover:border-slate-700 transition-all duration-300 shadow-sm hover:shadow-md flex items-center gap-4 focus:outline-none focus:ring-2 focus:ring-accent/50"
          >
            <!-- Squircle Wrapper -->
            <div class="w-12 h-12 rounded-2xl bg-accent-soft text-accent flex items-center justify-center text-lg flex-shrink-0 transition-transform group-hover:scale-105">
              <!-- Magnifier with Sparkles Combo SVG -->
              <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                <path d="M19 1.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6zM22 6.5l.4.9.9.4-.9.4-.4.9-.4-.9-.9-.4.9-.4z"/>
              </svg>
            </div>
            <div class="min-w-0 flex-1">
              <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-200 group-hover:text-accent transition-colors">Search with AI</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 truncate">Search using Google AI Mode</p>
            </div>
          </a>
        </div>

      </div>
    </main>

    <!-- 4. FOOTER -->
    <footer class="w-full py-6 text-center text-xs text-slate-400 dark:text-slate-500 select-none">
      ©2026 Dragon LLC
    </footer>

  </div>

  <!-- CUSTOMIZATION MODAL -->
  <div 
    id="customize-modal" 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200"
    onclick="handleModalBackdropClick(event)"
  >
    <div 
      class="w-full max-w-md bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-2xl transition-all duration-200 scale-95"
      id="modal-content"
    >
      <!-- Modal Header -->
      <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <!-- Paintbrush SVG (White in dark mode, accent in light mode) -->
          <svg class="w-5 h-5 fill-accent dark:fill-white" viewBox="0 0 24 24">
            <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/>
          </svg>
          Customize Appearance
        </h2>
        <button 
          onclick="closeModal()" 
          class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        >
          <!-- Close Cross SVG -->
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="py-6 space-y-6">
        
        <!-- Theme Selector (Light, Dark, System) -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3">Theme Mode</label>
          <div class="grid grid-cols-3 gap-2">
            <!-- Light Theme Option -->
            <button 
              onclick="setTheme('light')" 
              id="theme-btn-light"
              class="py-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-semibold flex flex-col items-center gap-2 hover:border-slate-300 dark:hover:border-slate-700 transition-all"
            >
              <!-- Sun SVG -->
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
              </svg>
              Light
            </button>

            <!-- Dark Theme Option -->
            <button 
              onclick="setTheme('dark')" 
              id="theme-btn-dark"
              class="py-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-semibold flex flex-col items-center gap-2 hover:border-slate-300 dark:hover:border-slate-700 transition-all"
            >
              <!-- Moon SVG -->
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path d="M12 3c-4.97 0-9 4.03-9 9 0 4.97 4.03 9 9 9 3.52 0 6.57-2.02 8.03-4.98-.38.05-.77.08-1.17.08-5.52 0-10-4.48-10-10 0-.4.03-.79.08-1.17C6.02 5.43 4 8.48 4 12c0 4.41 3.59 8 8 8 3.52 0 6.57-2.02 8.03-4.98-.38.05-.77.08-1.17.08z"/>
              </svg>
              Dark
            </button>

            <!-- System Theme Option with SVG Monitor Icon -->
            <button 
              onclick="setTheme('system')" 
              id="theme-btn-system"
              class="py-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-semibold flex flex-col items-center gap-2 hover:border-slate-300 dark:hover:border-slate-700 transition-all"
            >
              <!-- Desktop Monitor SVG Icon -->
              <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8v-1l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z"/>
              </svg>
              System
            </button>
          </div>
        </div>

        <!-- Accent Color Theme Selector -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3">Accent Color</label>
          <div class="grid grid-cols-5 gap-2" id="accent-picker">
            <!-- Blue Option -->
            <button 
              onclick="setAccent('blue')" 
              id="accent-btn-blue"
              title="Blue"
              class="group flex flex-col items-center gap-1.5 p-2 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 transition-all"
            >
              <span class="w-7 h-7 rounded-full bg-blue-500 ring-2 ring-offset-2 ring-transparent group-hover:scale-110 transition-transform"></span>
              <span class="text-[10px] font-medium text-slate-500 dark:text-slate-400">Blue</span>
            </button>

            <!-- Purple Option -->
            <button 
              onclick="setAccent('purple')" 
              id="accent-btn-purple"
              title="Purple"
              class="group flex flex-col items-center gap-1.5 p-2 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 transition-all"
            >
              <span class="w-7 h-7 rounded-full bg-purple-500 ring-2 ring-offset-2 ring-transparent group-hover:scale-110 transition-transform"></span>
              <span class="text-[10px] font-medium text-slate-500 dark:text-slate-400">Purple</span>
            </button>

            <!-- Emerald Option -->
            <button 
              onclick="setAccent('emerald')" 
              id="accent-btn-emerald"
              title="Emerald"
              class="group flex flex-col items-center gap-1.5 p-2 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 transition-all"
            >
              <span class="w-7 h-7 rounded-full bg-emerald-500 ring-2 ring-offset-2 ring-transparent group-hover:scale-110 transition-transform"></span>
              <span class="text-[10px] font-medium text-slate-500 dark:text-slate-400">Emerald</span>
            </button>

            <!-- Rose Option -->
            <button 
              onclick="setAccent('rose')" 
              id="accent-btn-rose"
              title="Rose"
              class="group flex flex-col items-center gap-1.5 p-2 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 transition-all"
            >
              <span class="w-7 h-7 rounded-full bg-rose-500 ring-2 ring-offset-2 ring-transparent group-hover:scale-110 transition-transform"></span>
              <span class="text-[10px] font-medium text-slate-500 dark:text-slate-400">Rose</span>
            </button>

            <!-- Amber Option -->
            <button 
              onclick="setAccent('amber')" 
              id="accent-btn-amber"
              title="Amber"
              class="group flex flex-col items-center gap-1.5 p-2 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 transition-all"
            >
              <span class="w-7 h-7 rounded-full bg-amber-500 ring-2 ring-offset-2 ring-transparent group-hover:scale-110 transition-transform"></span>
              <span class="text-[10px] font-medium text-slate-500 dark:text-slate-400">Amber</span>
            </button>
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex justify-end">
        <button 
          onclick="closeModal()" 
          class="px-5 py-2.5 rounded-xl bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 font-semibold text-xs hover:opacity-90 transition-opacity"
        >
          Done
        </button>
      </div>
    </div>
  </div>

  <!-- APPLICATION JAVASCRIPT LOGIC -->
  <script>
    // ACCENT COLOR CONFIGURATIONS (With wallpaper ambient background tints for ALL options)
    const ACCENT_CONFIGS = {
      blue: {
        accentHex: '#3b82f6',
        softBg: 'rgba(59, 130, 246, 0.12)',
        wallpaperGradient: 'radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.18) 0%, rgba(37, 99, 235, 0.05) 50%, transparent 80%)'
      },
      purple: {
        accentHex: '#a855f7',
        softBg: 'rgba(168, 85, 247, 0.12)',
        wallpaperGradient: 'radial-gradient(circle at 50% 20%, rgba(168, 85, 247, 0.18) 0%, rgba(147, 51, 234, 0.05) 50%, transparent 80%)'
      },
      emerald: {
        accentHex: '#10b981',
        softBg: 'rgba(16, 185, 129, 0.12)',
        wallpaperGradient: 'radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.18) 0%, rgba(5, 150, 105, 0.05) 50%, transparent 80%)'
      },
      rose: {
        accentHex: '#f43f5e',
        softBg: 'rgba(244, 63, 94, 0.12)',
        wallpaperGradient: 'radial-gradient(circle at 50% 20%, rgba(244, 63, 94, 0.18) 0%, rgba(225, 29, 72, 0.05) 50%, transparent 80%)'
      },
      amber: {
        accentHex: '#f59e0b',
        softBg: 'rgba(245, 158, 11, 0.12)',
        wallpaperGradient: 'radial-gradient(circle at 50% 20%, rgba(245, 158, 11, 0.18) 0%, rgba(217, 119, 6, 0.05) 50%, transparent 80%)'
      }
    };

    // DOM ELEMENTS
    const searchInput = document.getElementById('search-input');
    const searchBarWrapper = document.getElementById('search-bar-wrapper');
    const historyDropdown = document.getElementById('history-dropdown');
    const historyList = document.getElementById('history-list');
    const optionCardsContainer = document.getElementById('option-cards-container');
    const wallpaperTint = document.getElementById('wallpaper-tint');
    const customizeModal = document.getElementById('customize-modal');
    const modalContent = document.getElementById('modal-content');

    // STATE MANAGEMENT
    let currentTheme = localStorage.getItem('dragon_theme') || 'system';
    let currentAccent = localStorage.getItem('dragon_accent') || 'blue';
    let historyData = JSON.parse(localStorage.getItem('dragon_search_history') || '[]');

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Theme and Accent Setup
      applyTheme(currentTheme);
      applyAccent(currentAccent);

      // 2. Auto-focus search input on page load WITHOUT opening history dropdown
      if (searchInput) {
        searchInput.focus();
      }

      // 3. Render stored history
      renderHistory();

      // 4. Delayed Card Entrance Animation on page load (0.5 seconds delay)
      setTimeout(() => {
        if (!isHistoryOpen()) {
          optionCardsContainer.classList.remove('initial-delay-hide');
          optionCardsContainer.classList.add('animate-slide-down-in');
        }
      }, 500);

      // System Dark Mode Switch Listener
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (currentTheme === 'system') {
          applyTheme('system');
        }
      });
    });

    // --- SEARCH HISTORY VISIBILITY LOGIC ---
    function isHistoryOpen() {
      return !historyDropdown.classList.contains('hidden');
    }

    // REQUIRE EXPLICIT MOUSE CLICK TO SHOW HISTORY
    searchInput.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isHistoryOpen()) {
        openHistory();
      }
    });

    // Close history dropdown when clicking outside
    document.addEventListener('click', (e) => {
      if (!searchBarWrapper.contains(e.target) && isHistoryOpen()) {
        closeHistory();
      }
    });

    function openHistory() {
      renderHistory();
      
      // Animate Windows 11 Expansion
      historyDropdown.classList.remove('hidden', 'animate-win11-collapse');
      historyDropdown.classList.add('animate-win11-expand');

      // Smoothly hide option cards
      optionCardsContainer.style.opacity = '0';
      optionCardsContainer.style.pointerEvents = 'none';
      optionCardsContainer.style.transform = 'translateY(-10px)';
    }

    function closeHistory() {
      // Animate collapse
      historyDropdown.classList.remove('animate-win11-expand');
      historyDropdown.classList.add('animate-win11-collapse');

      setTimeout(() => {
        historyDropdown.classList.add('hidden');
      }, 180);

      // Restore option cards with slide down entrance
      optionCardsContainer.style.opacity = '1';
      optionCardsContainer.style.pointerEvents = 'auto';
      optionCardsContainer.style.transform = 'translateY(0)';
      optionCardsContainer.classList.remove('initial-delay-hide');
      optionCardsContainer.classList.add('animate-slide-down-in');
    }

    function handleSearchSubmit(event) {
      const query = searchInput.value.trim();
      if (!query) {
        event.preventDefault();
        return;
      }

      // Add query to LocalStorage search history
      addToHistory(query);
    }

    function addToHistory(query) {
      // Remove duplicate if exists
      historyData = historyData.filter(item => item.toLowerCase() !== query.toLowerCase());
      // Add to beginning
      historyData.unshift(query);
      // Limit to max 20 items
      if (historyData.length > 20) historyData.pop();

      // Save & Re-render
      localStorage.setItem('dragon_search_history', JSON.stringify(historyData));
      renderHistory();
    }

    function removeHistoryItem(event, index) {
      event.stopPropagation();
      historyData.splice(index, 1);
      localStorage.setItem('dragon_search_history', JSON.stringify(historyData));
      renderHistory();
    }

    function clearAllHistory() {
      historyData = [];
      localStorage.removeItem('dragon_search_history');
      renderHistory();
    }

    function selectHistoryQuery(query) {
      searchInput.value = query;
      closeHistory();
      document.getElementById('search-form').submit();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderHistory() {
      historyList.innerHTML = '';

      if (historyData.length === 0) {
        historyList.innerHTML = `
          <li class="px-4 py-6 text-center text-xs text-slate-400 dark:text-slate-500">
            No recent search history
          </li>
        `;
        return;
      }

      historyData.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'group flex items-center justify-between px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-800/60 cursor-pointer text-sm transition-colors text-slate-700 dark:text-slate-200';
        li.onclick = () => selectHistoryQuery(item);

        li.innerHTML = `
          <div class="flex items-center gap-3 truncate pr-2">
            <svg class="w-3.5 h-3.5 fill-current text-slate-400 dark:text-slate-500 group-hover:text-accent transition-colors flex-shrink-0" viewBox="0 0 24 24">
              <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8z"/>
            </svg>
            <span class="truncate font-medium">${escapeHtml(item)}</span>
          </div>
          <button 
            type="button" 
            onclick="removeHistoryItem(event, ${index})" 
            title="Delete item"
            class="p-1 px-2 rounded-lg opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all flex items-center justify-center"
          >
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        `;

        historyList.appendChild(li);
      });
    }

    // --- THEME & ACCENT MANAGEMENT ---
    function setTheme(mode) {
      currentTheme = mode;
      localStorage.setItem('dragon_theme', mode);
      applyTheme(mode);
    }

    function applyTheme(mode) {
      const root = document.documentElement;
      const isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

      if (isDark) {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }

      // Update Theme Button Active States in Modal
      ['light', 'dark', 'system'].forEach(m => {
        const btn = document.getElementById(`theme-btn-${m}`);
        if (!btn) return;

        if (m === mode) {
          btn.className = 'py-2.5 px-3 rounded-xl border border-accent bg-accent-soft text-accent text-xs font-semibold flex flex-col items-center gap-2 shadow-sm';
        } else {
          btn.className = 'py-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 text-xs font-semibold flex flex-col items-center gap-2 hover:border-slate-300 dark:hover:border-slate-700 transition-all';
        }
      });
    }

    function setAccent(color) {
      if (!ACCENT_CONFIGS[color]) return;
      currentAccent = color;
      localStorage.setItem('dragon_accent', color);
      applyAccent(color);
    }

    function applyAccent(color) {
      const config = ACCENT_CONFIGS[color] || ACCENT_CONFIGS.blue;
      const root = document.documentElement;

      // Update CSS Variables
      root.style.setProperty('--accent-color', config.accentHex);
      root.style.setProperty('--accent-soft', config.softBg);

      // Apply Ambient Wallpaper Gradient Tint
      if (wallpaperTint) {
        wallpaperTint.style.background = config.wallpaperGradient;
      }

      // Update Accent Button Selection Ring in Modal
      Object.keys(ACCENT_CONFIGS).forEach(key => {
        const btn = document.getElementById(`accent-btn-${key}`);
        if (!btn) return;
        const circle = btn.querySelector('span');

        if (key === color) {
          circle.className = 'w-7 h-7 rounded-full ring-2 ring-offset-2 ring-slate-900 dark:ring-white scale-105 transition-all';
          circle.style.backgroundColor = ACCENT_CONFIGS[key].accentHex;
        } else {
          circle.className = 'w-7 h-7 rounded-full ring-2 ring-offset-2 ring-transparent group-hover:scale-110 transition-transform';
          circle.style.backgroundColor = ACCENT_CONFIGS[key].accentHex;
        }
      });

      // Refresh Theme Active States to reflect color changes
      applyTheme(currentTheme);
    }

    // --- MODAL CONTROLS ---
    function openModal() {
      customizeModal.classList.remove('opacity-0', 'pointer-events-none');
      customizeModal.classList.add('opacity-100');
      modalContent.classList.remove('scale-95');
      modalContent.classList.add('scale-100');
    }

    function closeModal() {
      customizeModal.classList.remove('opacity-100');
      customizeModal.classList.add('opacity-0', 'pointer-events-none');
      modalContent.classList.remove('scale-100');
      modalContent.classList.add('scale-95');
    }

    function handleModalBackdropClick(event) {
      if (event.target === customizeModal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
